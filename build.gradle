plugins { id 'fabric-loom' version '1.13.5' }
group='com.matejpcs.netflared'
version=project.findProperty('mod_version') ?: '0.1.7-SNAPSHOT'
def mc=project.findProperty('minecraft_version') ?: '1.21.11'
def loader=project.findProperty('loader_version') ?: '0.18.4'
def api=project.findProperty('fabric_api_version') ?: '0.141.1+1.21.11'
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
dependencies {
 minecraft "com.mojang:minecraft:" + mc
 mappings loom.officialMojangMappings()
 modImplementation "net.fabricmc:fabric-loader:" + loader
 modImplementation "net.fabricmc.fabric-api:fabric-api:" + api
 implementation 'com.google.code.gson:gson:2.13.2'
}
processResources {
 inputs.property 'version', project.version
 inputs.property 'minecraft_version', mc
 inputs.property 'loader_version', loader
 filesMatching('fabric.mod.json') {
  expand(version:project.version, minecraft_version:mc, loader_version:loader)
 }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=21 }
