name: Build & Release Fabric all versions

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.1.13"

permissions:
  contents: write

jobs:
  build:
    name: Build Fabric ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.20"
            group: "1.20"
          - version: "1.20.1"
            group: "1.20"
          - version: "1.20.2"
            group: "1.20"
          - version: "1.20.3"
            group: "1.20"
          - version: "1.20.4"
            group: "1.20"
          - version: "1.20.5"
            group: "1.20"
          - version: "1.20.6"
            group: "1.20"
          - version: "1.21"
            group: "1.21"
          - version: "1.21.1"
            group: "1.21"
          - version: "1.21.2"
            group: "1.21"
          - version: "1.21.3"
            group: "1.21"
          - version: "1.21.4"
            group: "1.21"
          - version: "1.21.5"
            group: "1.21"
          - version: "1.21.6"
            group: "1.21"
          - version: "1.21.7"
            group: "1.21"
          - version: "1.21.8"
            group: "1.21"
          - version: "1.21.9"
            group: "1.21"
          - version: "1.21.10"
            group: "1.21"
          - version: "26.0"
            group: "26"
          - version: "26.1"
            group: "26"
          - version: "26.2"
            group: "26"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.version }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ startsWith(matrix.version, '26.') && '25' || ((matrix.version == '1.20.5' || matrix.version == '1.20.6' || startsWith(matrix.version, '1.21')) && '21' || '17') }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.group == '1.20' && '9.5.1' || '9.7.1' }}
      - name: Build
        env:
          VERSION: ${{ matrix.version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          api=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/ | grep -oE 'href="[^"]+\+'"$VERSION"'/"' | sed -E 's/href="([^"]+)"/\1/' | sed 's#/$##' | sort -V | tail -1)
          test -n "$api"
          case "$VERSION" in
            1.20|1.20.1|1.20.2|1.20.3|1.20.4|1.20.5|1.20.6) loader=0.15.11 ;;
            1.21|1.21.1|1.21.2|1.21.3|1.21.4|1.21.5) loader=0.16.10 ;;
            1.21.6|1.21.7|1.21.8) loader=0.17.2 ;;
            1.21.9|1.21.10) loader=0.18.0 ;;
            1.21.11) loader=0.18.4 ;;
            26.1) loader=0.19.4 ;;
            26.2) loader=0.19.5 ;;
            *) exit 1 ;;
          esac
          gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pmod_version="$RELEASE_VERSION" -Pminecraft_version="$VERSION" -Ploader_version="$loader" -Pfabric_api_version="$api"
          jar=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)
          test -n "$jar"
          cp "$jar" "netflared-server-fabric-$VERSION.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-${{ matrix.version }}
          path: netflared-server-fabric-${{ matrix.version }}.jar

  release:
    name: Release Fabric ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: ["1.20","1.21","26"]
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: fabric-${{ matrix.group }}*
          path: grouped
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.release_version }}-fabric-${{ matrix.group }}
          name: Netflared Server ${{ inputs.release_version }} — Fabric ${{ matrix.group }}
          generate_release_notes: false
          files: grouped/*.jar
