name: Build & Release Fabric compatibility bundles

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.1.11"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "Fabric 1.20.6"
            ref: "1.20.x"
            mc: "1.20.6"
            loader: "0.15.11"
            api: "0.100.8+1.20.6"
            java: "21"
            gradle: "9.5.1"
            artifact: "netflared-fabric-1.20.6"
          - label: "Fabric 1.21.11"
            ref: "1.21.x"
            mc: "1.21.11"
            loader: "0.18.4"
            api: "0.141.6+1.21.11"
            java: "21"
            gradle: "8.14.3"
            artifact: "netflared-fabric-1.21.11"
          - label: "Fabric 26.2"
            ref: "26.x"
            mc: "26.2"
            loader: "0.19.3"
            api: "0.154.0+26.2"
            java: "25"
            gradle: "9.7.1"
            artifact: "netflared-fabric-26.2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pmod_version="0.1.11" -Pminecraft_version="${{ matrix.mc }}" -Ploader_version="${{ matrix.loader }}" -Pfabric_api_version="${{ matrix.api }}"
      - name: Verify JAR
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -gt 0
          printf '%s\n' "${jars[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ inputs.release_version || '0.1.11' }}"
          name: "Netflared Server ${{ inputs.release_version || '0.1.11' }} — Fabric"
          target_commitish: main
          generate_release_notes: true
          files: release/*.jar
