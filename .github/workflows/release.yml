name: Build & Release Fabric all versions
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version
        required: true
        default: "0.1.13"
permissions:
  contents: write
jobs:
  build:
    name: Build Fabric ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.20"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.1"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.2"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.3"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.4"
            group: "1.20"
            java: "17"
            gradle: "8.8"
          - version: "1.20.5"
            group: "1.20"
            java: "21"
            gradle: "8.14.3"
          - version: "1.20.6"
            group: "1.20"
            java: "21"
            gradle: "8.14.3"
          - version: "1.21"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.1"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.2"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.3"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.4"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.5"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.6"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.7"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.8"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.9"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.10"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "1.21.11"
            group: "1.21"
            java: "21"
            gradle: "9.5.1"
          - version: "26.1"
            group: "26"
            java: "25"
            gradle: "9.5.1"
          - version: "26.2"
            group: "26"
            java: "25"
            gradle: "9.5.1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.version }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Resolve Fabric versions
        id: deps
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          loader="$(curl -fsSL "https://meta.fabricmc.net/v2/versions/loader/$VERSION" | jq -r '.[0].loader.version // empty')"
          api="$(curl -fsSLG "https://api.modrinth.com/v2/project/P7dR8mSH/version" --data-urlencode "game_versions=[\"$VERSION\"]" --data-urlencode 'loaders=["fabric"]' | jq -r 'map(select(.status == "listed")) | .[0].version_number // empty')"
          test -n "$loader" && test "$loader" != "null"
          test -n "$api" && test "$api" != "null"
          echo "loader=$loader" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ matrix.version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          LOADER_VERSION: ${{ steps.deps.outputs.loader }}
          FABRIC_API_VERSION: ${{ steps.deps.outputs.api }}
        run: |
          set -euo pipefail
          gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pmod_version="$RELEASE_VERSION" -Pminecraft_version="$VERSION" -Ploader_version="$LOADER_VERSION" -Pfabric_api_version="$FABRIC_API_VERSION"
          jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' | head -n1)"
          test -n "$jar"
          cp "$jar" "netflared-server-fabric-$VERSION.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-${{ matrix.version }}
          path: netflared-server-fabric-${{ matrix.version }}.jar
  release:
    name: Release Fabric ${{ matrix.group }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: ["1.20","1.21","26"]
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: fabric-${{ matrix.group }}*
          path: grouped
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.release_version }}-fabric-${{ matrix.group }}
          name: Netflared Server ${{ inputs.release_version }} — Fabric ${{ matrix.group }}
          generate_release_notes: false
          files: grouped/*.jar
