name: Build Fabric 26.x

on:
  push:
    branches: ["26.x"]
  pull_request:
    branches: ["26.x"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pminecraft_version="26.2" -Ploader_version="0.19.3" -Pfabric_api_version="0.154.0+26.2"
      - name: Verify JAR
        run: test -n "$(find build/libs -maxdepth 1 -name '*.jar' -print -quit)"
      - uses: actions/upload-artifact@v6
        with:
          name: netflared-fabric-26.2
          path: build/libs/*.jar
          if-no-files-found: error
