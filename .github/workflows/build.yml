name: Build Fabric 1.20.x

on:
  push:
    branches: ["1.20.x"]
  pull_request:
    branches: ["1.20.x"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netflared-fabric-1-20-x
  cancel-in-progress: true

jobs:
  build:
    name: Fabric ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.20"
            loader: "0.14.21"
            api: "0.83.0+1.20"
            java: "17"
          - mc: "1.20.1"
            loader: "0.16.14"
            api: "0.92.12+1.20.1"
            java: "17"
          - mc: "1.20.2"
            loader: "0.16.14"
            api: "0.91.6+1.20.2"
            java: "17"
          - mc: "1.20.3"
            loader: "0.16.14"
            api: "0.91.1+1.20.3"
            java: "17"
          - mc: "1.20.4"
            loader: "0.16.14"
            api: "0.97.3+1.20.4"
            java: "17"
          - mc: "1.20.5"
            loader: "0.15.11"
            api: "0.97.8+1.20.5"
            java: "21"
          - mc: "1.20.6"
            loader: "0.15.11"
            api: "0.100.8+1.20.6"
            java: "21"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "${{ matrix.java }}"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.1"
      - name: Build
        run: gradle clean build --no-daemon --stacktrace --refresh-dependencies -Pminecraft_version="${{ matrix.mc }}" -Ploader_version="${{ matrix.loader }}" -Pfabric_api_version="${{ matrix.api }}"
      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/*.jar)
          test "${#jars[@]}" -gt 0
          printf '%s
' "${jars[@]}"
      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: netflared-fabric-1-20-x
          path: build/libs/*.jar
          if-no-files-found: error
